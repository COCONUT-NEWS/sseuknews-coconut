name: Build and Push News AI to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::875522371656:role/GitHubOIDCRole
        aws-region: ap-northeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Generate .env for News AI
      run: |
        echo "DB_HOST_AI=${{ secrets.DB_HOST }}" >> ./NewsAI/.env
        echo "DB_USER_AI=${{ secrets.DB_USER }}" >> ./NewsAI/.env
        echo "DB_PASSWORD_AI=${{ secrets.DB_PASSWORD }}" >> ./NewsAI/.env
        echo "DB_NAME_AI=${{ secrets.DB_NAME_AI }}" >> ./NewsAI/.env

    - name: Build Docker image
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/sseuk:news-ai ./NewsAI

    - name: Push Docker image to ECR
      run: |
        docker push ${{ steps.login-ecr.outputs.registry }}/sseuk:news-ai

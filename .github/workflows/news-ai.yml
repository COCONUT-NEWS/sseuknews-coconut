name: Build and Push News AI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Add Harbor CA cert (Self-signed)
      run: |
        sudo mkdir -p /etc/docker/certs.d/${{ secrets.HARBOR_URL }}
        echo "${{ secrets.HARBOR_CA_B64 }}" | base64 -d | sudo tee /etc/docker/certs.d/${{ secrets.HARBOR_URL }}/ca.crt > /dev/null

    - name: Log in to Harbor
      run: |
        echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ secrets.HARBOR_URL }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.HARBOR_URL }}/sseuk/news-ai:latest ./NewsAI

    - name: Push Docker image
      run: |
        docker push ${{ secrets.HARBOR_URL }}/sseuk/news-ai:latest
    
    - name: Replace HARBOR_URL in Deployment YAML
      run: |
        export HARBOR_URL=${{ secrets.HARBOR_URL }}
        envsubst < manifests/news-ai/news-ai-deploy.yaml.template > manifests/news-ai/news-ai-deploy.yaml




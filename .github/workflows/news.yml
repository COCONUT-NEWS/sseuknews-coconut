name: Build and Push News Crawler to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::875522371656:role/GitHubOIDCRole
        aws-region: ap-northeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set environment variables for News Crawler
      run: |
        echo "DB_HOST_NEWS=${{ secrets.DB_HOST }}" >> ./News/.env
        echo "DB_USER_NEWS=${{ secrets.DB_USER }}" >> ./News/.env
        echo "DB_PASSWORD_NEWS=${{ secrets.DB_PASSWORD }}" >> ./News/.env
        echo "DB_NAME_NEWS=${{ secrets.DB_NAME_NEWS }}" >> ./News/.env

    - name: Build Docker image
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/sseuk:news ./News

    - name: Push Docker image to ECR
      run: |
        docker push ${{ steps.login-ecr.outputs.registry }}/sseuk:news

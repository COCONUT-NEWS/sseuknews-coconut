name: Build and Push News API to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write       # GitHub OIDC 인증에 필요
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials using OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::875522371656:role/GitHubOIDCRole
        aws-region: ap-northeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/sseuk:news-api ./NewsAPI

    - name: Push Docker image to ECR
      run: |
        docker push ${{ steps.login-ecr.outputs.registry }}/sseuk:news-api
        
        docker build -t ${{ steps.login-ecr.outputs.registry }}/sseuk/news-api:latest ./NewsAPI

    - name: Push Docker image to ECR
      run: |
        docker push ${{ steps.login-ecr.outputs.registry }}/sseuk/news-api:latest

    - name: Set environment variables for News API
      run: |
        echo "DB_HOST_API=${{ secrets.DB_HOST }}" >> .env
        echo "DB_USER_API=${{ secrets.DB_USER }}" >> .env
        echo "DB_PASSWORD_API=${{ secrets.DB_PASSWORD }}" >> .env
        echo "DB_NAME_API=${{ secrets.DB_NAME_API }}" >> .env

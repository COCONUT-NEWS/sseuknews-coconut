version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: mysql_news
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root     
      MYSQL_DATABASE: coconut_db
      MYSQL_USER: user
      MYSQL_PASSWORD: test123
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

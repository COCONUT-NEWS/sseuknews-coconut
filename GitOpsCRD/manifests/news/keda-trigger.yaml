apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: news-scaler
  namespace: default # 애플리케이션이 배포된 네임스페이스
spec:
  scaleTargetRef:
    name: news # 확장할 Deployment의 이름
  pollingInterval: 30  # Optional: KEDA가 메트릭을 폴링하는 간격 (초)
  cooldownPeriod:  300 # Optional: 마지막 트리거 후 스케일 다운까지 대기 시간 (초)
  minReplicaCount: 0   # 중요: 평소에는 0개로 스케일 다운 가능하도록 설정
  maxReplicaCount: 2  # Optional: 최대 복제본 수
  triggers:
  # 1. Cron 기반 트리거 (한국 시간 오전 6시 ~ 6시 5분 동안 최소 1개 유지)
  - type: cron
    metadata:
      timezone: "Asia/Seoul"       # 한국 시간대
      start: "00 10 * * *"           # 매일 오전 6시 00분에 시작
      end: "00 13 * * *"             # 매일 오전 6시 30분에 종료 (30분 동안만 활성)
      desiredReplicas: "2"         # 이 시간 동안 최소 2개의 복제본을 원함

  
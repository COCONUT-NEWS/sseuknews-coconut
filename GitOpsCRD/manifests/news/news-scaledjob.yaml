apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: news-scaledjob # ScaledJob의 이름 (예: news-crawler-sj)
  namespace: default # 애플리케이션을 배포할 네임스페이스
spec:
  jobTargetRef: # 이 ScaledJob이 생성할 Kubernetes Job의 템플릿
    # Job의 성공적인 완료 조건 (선택 사항, 기본값은 각각 1, 1)
    # parallelism: 1 # 동시에 실행할 Pod 수
    # completions: 1 # 성공적으로 완료되어야 하는 Pod 수
    backoffLimit: 2 # Job 실패 시 재시도 횟수 (0이면 재시도 안함, 기본값 6)
    template: # Job에 의해 생성될 Pod의 템플릿
      spec:
        affinity: # 기존 Deployment의 affinity 설정을 여기에 적용
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: eks.amazonaws.com/nodegroup
                  operator: In
                  values:
                  - pracite-ng-2
                  - pracite-ng-3
        containers:
        - name: news-crawler-container # 컨테이너 이름
          image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:news # ECR 이미지 주소
          imagePullPolicy: Always # 항상 최신 이미지를 가져오도록 설정
          # ports: # Job의 Pod는 외부 서비스를 제공하지 않으므로 일반적으로 ports 설정 불필요
          # - containerPort: 80
          env: # 기존 Deployment의 환경 변수 설정을 여기에 적용
          - name: DB_HOST_NEWS
            value: coconut-db.clkkkki229kj.ap-northeast-1.rds.amazonaws.com
          - name: DB_USER_NEWS
            valueFrom:
              secretKeyRef:
                name: news-secrets
                key: DB_USER
          - name: DB_PASSWORD_NEWS
            valueFrom:
              secretKeyRef:
                name: news-secrets
                key: DB_PASSWORD
          - name: DB_NAME_NEWS
            valueFrom:
              secretKeyRef:
                name: news-secrets
                key: DB_NAME_NEWS
         
        restartPolicy: OnFailure # Job 내 Pod의 컨테이너 재시작 정책.
                                 # OnFailure: 컨테이너 실패 시 Pod 내에서 재시작 (Job의 backoffLimit에 따라 Job 레벨 재시도도 있음)
                                 # Never: 컨테이너 실패 시 Pod 내에서 재시작 안함 (Job 레벨 재시도만)
  # KEDA 폴링 간격 및 Job 기록 설정 (선택 사항)
  pollingInterval: 60  # KEDA가 트리거를 확인하는 간격 (초). cron 트리거에는 덜 중요하지만 설정 권장.
  successfulJobsHistoryLimit: 3 # 보관할 성공한 Job 기록 수
  failedJobsHistoryLimit: 3     # 보관할 실패한 Job 기록 수

  # Job 실행 동시성 정책 (선택 사항, 기본값: Allow)
  # Forbid: 이전 Job이 아직 실행 중이면 새 Job을 스케줄링하지 않음 (권장)
  concurrencyPolicy: Forbid

  triggers:
  - type: cron
    metadata:
      timezone: "Asia/Seoul"    # 한국 시간대 설정
      # 예시: 매일 오전 10시에 실행 (실제 원하는 시간으로 변경)
      # 원하는 스케줄로 cron 표현식 수정 (예: "0 1 * * *" 매일 새벽 1시)
      schedule: "35 13 * * *"   # KEDA ScaledJob에서는 'schedule' 필드를 사용합니다. (이전 'start'는 ScaledObject용)
                                # "00 10 * * *" -> 매일 오전 10시 00분
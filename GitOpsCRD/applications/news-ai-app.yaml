apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: news-ai-app
  namespace: argocd # ArgoCD가 설치된 네임스페이스
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # App 삭제 시 관련 리소스도 함께 삭제
spec:
  project: default # 또는 사용하는 ArgoCD 프로젝트 이름
  source:
    repoURL: 'https://github.com/COCONUT-NEWS/sseuknews-coconut.git' # Deployment 매니페스트가 있는 Git 리포지토리 주소
    path: 'GitOpsCRD/manifests/news' # Git 리포지토리 내의 news Deployment 매니페스트 경로
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc' # 대상 클러스터
    namespace: 'default' # news Deployment를 배포할 네임스페이스
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  # 여기에 ignoreDifferences를 추가합니다.
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: news # KEDA가 관리하는 Deployment의 이름 (위 Deployment 매니페스트의 metadata.name과 일치)
    jsonPointers:
    - /spec/replicas
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-app
  namespace: argocd # ArgoCD가 설치된 네임스페이스
  # KEDA 자체를 클러스터 전체의 중요한 컴포넌트로 간주하여 삭제 방지 finalizer 추가 가능
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io
spec:
  project: default # 또는 생성한 ArgoCD 프로젝트

  source:
    repoURL: https://kedacore.github.io/charts # KEDA 공식 Helm 차트 리포지토리
    chart: keda
    targetRevision: "2.13.0" # 배포할 KEDA Helm 차트 버전 (최신 버전 확인 필요)
    helm:

  destination:
    server: https://kubernetes.default.svc
    namespace: keda # KEDA를 배포할 네임스페이스 (없으면 CreateNamespace=true로 생성)

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # 'keda' 네임스페이스가 없으면 자동 생성
      
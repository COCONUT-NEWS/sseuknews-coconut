apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-app
  namespace: argocd 
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default # 또는 생성한 ArgoCD 프로젝트
  source:
    repoURL: https://kedacore.github.io/charts # KEDA 공식 Helm 차트 리포지토리
    chart: keda
    targetRevision: "2.13.0" # 배포할 KEDA Helm 차트 버전 (최신 버전 확인 필요)
    helm:
      # KEDA Helm 차트의 기본값을 사용. 필요시 여기에 values를 추가하여 커스터마이징.
      # 예:
      # values: |
      #   operator:
      #     logLevel: info
      #   metricsServer:
      #     logLevel: info

  destination:
    server: https://kubernetes.default.svc
    namespace: keda # KEDA를 배포할 네임스페이스 (없으면 CreateNamespace=true로 생성)

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # 'keda' 네임스페이스가 없으면 자동 생성
      
        # CRD 어노테이션 크기 문제 해결 -> CRD 정의 자체의 metadata.annotations 필드의 전체 크기가 쿠버네티스가 허용하는 최대 크기
        # 를 초과하여 scaledjobs.keda.sh CRD가 클러스터에 생성되지 못하는 오류 해결 -> 서버측에서 리소스를 지능적으로 처리 가능
      - ServerSideApply=true 

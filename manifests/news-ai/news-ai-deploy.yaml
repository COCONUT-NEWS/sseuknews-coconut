# manifests/news/news-ai-deploy.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: news-ai
  template:
    metadata:
      labels:
        app: news-ai
    spec:
      serviceAccountName: news-ai-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: eks.amazonaws.com/nodegroup
                operator: In
                values:
                - pracite-ng-2
                - pracite-ng-3
      containers:
      - name: news-ai-ctn
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:news-ai
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: AWS_REGION
          value: "ap-northeast-1"
        - name: DB_HOST_AI
          value: coconut-db.clkkki229kj.ap-northeast-1.rds.amazonaws.com
        - name: DB_USER_AI
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_USER
        - name: DB_PASSWORD_AI
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_PASSWORD
        - name: DB_NAME_AI
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_NAME_AI

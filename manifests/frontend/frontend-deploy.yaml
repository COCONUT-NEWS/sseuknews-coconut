apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-controller
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:frontend
        imagePullPolicy: Always
        ports:
        - containerPort: 80

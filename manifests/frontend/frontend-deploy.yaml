apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: # 파드가 반드시 이 조건에 맞는 노드에 스케줄링되어야 합니다.
            nodeSelectorTerms:
            - matchExpressions:
              - key: eks.amazonaws.com/nodegroup # EKS 관리형 노드 그룹의 기본 레이블 키입니다.
                                                  # 실제 클러스터의 노드 레이블을 'kubectl get nodes --show-labels'로 확인하세요.
                operator: In
                values:
                - pracite-ng-0
                - pracite-ng-1

      containers:
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:frontend-20250527
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

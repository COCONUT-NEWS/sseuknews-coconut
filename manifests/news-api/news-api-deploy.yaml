# manifests/news/news-api-deploy.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: news-api
  template:
    metadata:
      labels:
        app: news-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: eks.amazonaws.com/nodegroup
                operator: In
                values:
                - pracite-ng-2
                - pracite-ng-3
      containers:
      - name: news-api-controller
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:news-api
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST_API
          value: coconut-db.clkkki229kj.ap-northeast-1.rds.amazonaws.com
        - name: DB_USER_API
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_USER
        - name: DB_PASSWORD_API
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_PASSWORD
        - name: DB_NAME_API
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_NAME_API

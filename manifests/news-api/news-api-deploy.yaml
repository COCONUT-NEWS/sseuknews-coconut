apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-api
  template:
    metadata:
      labels:
        app: news-api
    spec:
      containers:
      - name: news-api-controller
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:news-api
        imagePullPolicy: Always
        ports:
        - containerPort: 80

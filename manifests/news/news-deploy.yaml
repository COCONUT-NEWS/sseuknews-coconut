# news/news-deploy.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: news
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news
  template:
    metadata:
      labels:
        app: news
    spec:
      containers:
      - name: news-ctn
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:news
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST_NEWS
          value: coconut-db.clkkki229kj.ap-northeast-1.rds.amazonaws.com
        - name: DB_USER_NEWS
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_USER
        - name: DB_PASSWORD_NEWS
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_PASSWORD
        - name: DB_NAME_NEWS
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_NAME_NEWS


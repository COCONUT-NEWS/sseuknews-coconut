# news/news-deploy.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: news
spec:
  replicas: 2
  selector:
    matchLabels:
      app: news
  template:
    metadata:
      labels:
        app: news
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: # 파드가 반드시 이 조건에 맞는 노드에 스케줄링되어야 합니다.
            nodeSelectorTerms:
            - matchExpressions:
              - key: eks.amazonaws.com/nodegroup # EKS 관리형 노드 그룹의 기본 레이블 키입니다.
                                                  # 실제 클러스터의 노드 레이블을 'kubectl get nodes --show-labels'로 확인하세요.
                operator: In
                values:
                - pracite-ng-2
                - pracite-ng-3
      containers:
      - name: news-ctn
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:news
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST_NEWS
          value: coconut-db.clkkki229kj.ap-northeast-1.rds.amazonaws.com
        - name: DB_USER_NEWS
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_USER
        - name: DB_PASSWORD_NEWS
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_PASSWORD
        - name: coconut_news
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: coconut_news


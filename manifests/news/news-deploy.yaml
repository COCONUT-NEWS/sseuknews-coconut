apiVersion: apps/v1
kind: Deployment
metadata:
  name: news
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news
  template:
    metadata:
      labels:
        app: news
    spec:
      containers:
      - name: news-ctn
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:news
        imagePullPolicy: Always
        ports:
        - containerPort: 80

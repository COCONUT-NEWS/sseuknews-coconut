# news/news-deploy.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: news
spec:
  replicas: 2
  selector:
    matchLabels:
      app: news
  template:
    metadata:
      labels:
        app: news
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: eks.amazonaws.com/nodegroup
                operator: In
                values:
                - pracite-ng-2
                - pracite-ng-3
      containers:
      - name: news-ctn
        image: 875522371656.dkr.ecr.ap-northeast-1.amazonaws.com/sseuk:news
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST_NEWS
          value: coconut-db.clkkkki229kj.ap-northeast-1.rds.amazonaws.com
          
        - name: DB_USER_NEWS
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_USER
        - name: DB_PASSWORD_NEWS
          valueFrom:
            secretKeyRef:
              name: news-secrets
              key: DB_PASSWORD

        - name: DB_NAME_NEWS
          value: coconut_news

        - name: DB_NAME_API
          value: coconut_api

        - name: DB_NAME_AI
          value: coconut_ai

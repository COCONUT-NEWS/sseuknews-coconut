apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default-ec2nodeclass
spec:
  amiFamily: AL2 # Amazon Linux 2
  role: arn:aws:iam::123456789012:role/KarpenterNodeRole-yourcluster
  subnetSelector:
    karpenter.sh/discovery: your-cluster-name
  securityGroupSelector:
    karpenter.sh/discovery: your-cluster-name
  instanceProfile: KarpenterNodeInstanceProfile-yourcluster
